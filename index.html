<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PIPS - Daily Domino Logic Game</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
      margin: 0;
    }

    /* Board Container */
    .board-card {
      background-color: #f3efe6;
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
    }

    /* Cell Internal Grid Lines */
    .board-cell {
      position: relative;
      box-sizing: border-box;
      transition: background-color 0.2s ease;
    }
    
    .cell-inner-grid {
      position: absolute;
      inset: 0;
      border: 1px dashed rgba(0, 0, 0, 0.15);
      pointer-events: none;
    }

    /* Region Outer Borders */
    .border-t-region { border-top: 3px solid var(--region-border-color) !important; }
    .border-b-region { border-bottom: 3px solid var(--region-border-color) !important; }
    .border-l-region { border-left: 3px solid var(--region-border-color) !important; }
    .border-r-region { border-right: 3px solid var(--region-border-color) !important; }

    /* Rule Diamond Badge */
    .rule-badge {
      position: absolute;
      width: 32px;
      height: 32px;
      transform: translate(-50%, -50%) rotate(45deg);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.25);
      z-index: 25;
      pointer-events: auto;
      cursor: help;
    }

    .rule-badge-text {
      transform: rotate(-45deg);
      color: #ffffff;
      font-weight: 800;
      font-size: 13px;
      line-height: 1;
      white-space: nowrap;
    }

    /* Authentic Domino Styling */
    .domino-tile {
      background: linear-gradient(145deg, #ffffff, #f7f7f8);
      border: 1.5px solid #cbd5e1;
      border-bottom: 3px solid #94a3b8;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.9);
      box-sizing: border-box;
      display: flex;
      position: relative;
      cursor: grab;
      transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.15s ease;
      touch-action: none;
    }

    .domino-tile:active {
      cursor: grabbing;
    }

    .domino-tile.vertical {
      flex-direction: column;
    }

    .domino-half {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
    }

    .domino-divider-h {
      width: 1.5px;
      height: 80%;
      margin: auto 0;
      background-color: #cbd5e1;
    }

    .domino-divider-v {
      height: 1.5px;
      width: 80%;
      margin: 0 auto;
      background-color: #cbd5e1;
    }

    /* Domino Pip Dot Hardcoded Layouts */
    .pip-dot {
      position: absolute;
      width: 20%;
      height: 20%;
      background-color: #2b2d42;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: inset 0 1px 1px rgba(0,0,0,0.4);
    }

    /* Validated Region Glows */
    .region-valid {
      filter: drop-shadow(0 0 4px rgba(34, 197, 94, 0.4));
    }
    
    .region-invalid {
      filter: drop-shadow(0 0 4px rgba(239, 68, 68, 0.3));
    }

    /* Floating Drag Ghost */
    #drag-ghost {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 9999;
      display: none;
      opacity: 0.92;
      transform-origin: top left;
      filter: drop-shadow(0 12px 20px rgba(0,0,0,0.25));
    }

    /* Modal Styling */
    .modal-overlay {
      background-color: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
    }

    /* Custom Scrollbar for Tray */
    .tray-scroll::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    .tray-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="flex flex-col h-screen w-screen overflow-hidden select-none">

  <!-- Header -->
  <header class="flex-none bg-white border-b border-slate-200 px-4 py-2.5 flex items-center justify-between shadow-sm z-30">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 bg-slate-900 text-white rounded-lg flex items-center justify-center font-bold text-lg shadow">
        ::
      </div>
      <h1 class="text-xl font-extrabold tracking-tight text-slate-900">PIPS</h1>
    </div>

    <div class="flex items-center space-x-2">
      <button id="btn-sound" class="p-2 text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded-lg transition" title="Toggle Audio">
        <svg id="icon-sound-on" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
        <svg id="icon-sound-off" class="w-5 h-5 hidden text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15zM17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/></svg>
      </button>
      <button id="btn-stats" class="p-2 text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded-lg transition" title="Statistics">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 012 2h2a2 2 0 012-2z"/></svg>
      </button>
    </div>
  </header>

  <!-- Control Bar -->
  <div class="flex-none bg-slate-50 border-b border-slate-200 px-4 py-2 flex items-center justify-between text-sm">
    <!-- Difficulty Selector -->
    <div class="flex bg-slate-200/80 p-1 rounded-xl font-medium text-slate-700">
      <button data-diff="easy" class="btn-diff px-3 py-1 rounded-lg transition font-semibold text-xs sm:text-sm">Easy</button>
      <button data-diff="medium" class="btn-diff px-3 py-1 rounded-lg transition font-semibold text-xs sm:text-sm">Medium</button>
      <button data-diff="hard" class="btn-diff px-3 py-1 rounded-lg transition font-semibold text-xs sm:text-sm">Hard</button>
    </div>

    <!-- Timer & Controls -->
    <div class="flex items-center space-x-3">
      <div class="flex items-center space-x-1.5 bg-white px-3 py-1 rounded-lg border border-slate-200 shadow-sm text-slate-700 font-mono font-bold text-xs sm:text-sm">
        <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span id="timer-display">00:00</span>
      </div>
      <button id="btn-restart" class="p-1.5 bg-white border border-slate-200 rounded-lg text-slate-600 hover:text-slate-900 shadow-sm hover:bg-slate-50 transition" title="Reset Current Board">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
      </button>
      <button id="btn-new" class="p-1.5 bg-slate-900 text-white rounded-lg hover:bg-slate-800 shadow transition flex items-center space-x-1 px-2.5 font-medium text-xs sm:text-sm" title="New Puzzle">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        <span>New</span>
      </button>
    </div>
  </div>

  <!-- Main Game Layout -->
  <main class="flex-1 flex flex-col min-h-0 relative p-2 sm:p-4 overflow-hidden items-center justify-between">
    
    <!-- Board Container Box -->
    <div class="w-full flex-1 flex items-center justify-center min-h-0 relative">
      <div id="board-card" class="board-card p-3 sm:p-5 relative flex items-center justify-center transition-all duration-300">
        <div id="board-grid" class="relative">
          <!-- Dynamically populated board grid & badges -->
        </div>
      </div>
    </div>

    <!-- Bottom Tray Section -->
    <div class="w-full max-w-2xl flex-none bg-white rounded-2xl border border-slate-200/80 shadow-lg p-3 flex flex-col space-y-2 mt-2">
      <div class="flex items-center justify-between text-xs text-slate-500 font-semibold px-1">
        <span class="flex items-center space-x-1.5">
          <span>Dominoes</span>
          <span id="tray-count" class="bg-slate-100 text-slate-700 px-2 py-0.5 rounded-full text-[11px] font-bold">0</span>
        </span>
        <span class="text-slate-400 font-normal hidden sm:inline">Tap tile in tray to rotate 90° • Drag to place</span>
        <span class="text-slate-400 font-normal sm:hidden">Tap = Rotate • Drag = Place</span>
      </div>

      <!-- Scrollable Tray Area -->
      <div id="domino-tray" class="tray-scroll flex flex-wrap items-center justify-center gap-3 p-2 min-h-[90px] max-h-[140px] overflow-y-auto bg-slate-50/60 rounded-xl border border-dashed border-slate-200">
        <!-- Tray Domino Items -->
      </div>
    </div>

  </main>

  <!-- Drag Ghost Canvas -->
  <div id="drag-ghost"></div>

  <!-- Win Modal -->
  <div id="win-modal" class="modal-overlay fixed inset-0 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full shadow-2xl text-center space-y-5 border border-slate-100 transform transition-all scale-95 opacity-0" id="win-modal-card">
      <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-2xl mx-auto flex items-center justify-center font-bold text-3xl shadow-inner">
        ✓
      </div>
      <div>
        <h2 class="text-2xl font-extrabold text-slate-900">Puzzle Solved!</h2>
        <p class="text-slate-500 text-sm mt-1">Excellent logic work!</p>
      </div>

      <div class="bg-slate-50 rounded-2xl p-4 flex justify-around border border-slate-100">
        <div>
          <div class="text-xs text-slate-400 uppercase font-semibold">Time</div>
          <div id="win-time" class="text-xl font-mono font-bold text-slate-800">00:00</div>
        </div>
        <div class="w-px bg-slate-200"></div>
        <div>
          <div class="text-xs text-slate-400 uppercase font-semibold">Difficulty</div>
          <div id="win-diff" class="text-xl font-bold text-slate-800 capitalize">Easy</div>
        </div>
      </div>

      <button id="btn-win-next" class="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl shadow-lg transition transform active:scale-95">
        Play Next Puzzle
      </button>
    </div>
  </div>

  <!-- Stats Modal -->
  <div id="stats-modal" class="modal-overlay fixed inset-0 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl space-y-5 border border-slate-100 relative">
      <button id="btn-close-stats" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>

      <h2 class="text-xl font-extrabold text-slate-900">Your Statistics</h2>

      <div class="grid grid-cols-3 gap-3" id="stats-grid">
        <!-- Stats populated via JS -->
      </div>

      <button id="btn-reset-stats" class="text-xs text-rose-500 hover:text-rose-700 font-semibold w-full text-center py-1">
        Reset All Statistics
      </button>
    </div>
  </div>

  <script>
    // Audio Synth Engine (Web Audio API)
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }
      playClick() {
        if (!this.enabled) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(150, this.ctx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.04);
      }
      playPlace() {
        if (!this.enabled) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(220, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(440, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      }
      playWin() {
        if (!this.enabled) return;
        this.init();
        const notes = [261.63, 329.63, 392.00, 523.25];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.08);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.08 + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + idx * 0.08);
          osc.stop(this.ctx.currentTime + idx * 0.08 + 0.25);
        });
      }
    }

    const sound = new SoundEngine();

    // Color Palette for Regions
    const REGION_PALETTES = [
      { bg: '#e2d9f3', border: '#7c5295', text: '#ffffff' }, // Purple
      { bg: '#fcd5ce', border: '#d94e67', text: '#ffffff' }, // Rose
      { bg: '#c7ebd9', border: '#428a60', text: '#ffffff' }, // Sage Green
      { bg: '#bae6fd', border: '#0284c7', text: '#ffffff' }, // Sky Blue
      { bg: '#fef08a', border: '#ca8a04', text: '#ffffff' }, // Amber
      { bg: '#fed7aa', border: '#ea580c', text: '#ffffff' }, // Orange
      { bg: '#cbd5e1', border: '#475569', text: '#ffffff' }, // Slate
      { bg: '#e9d5ff', border: '#9333ea', text: '#ffffff' }, // Lavender
    ];

    // Difficulty Configuration
    const DIFF_CONFIG = {
      easy: { dominoes: 4, rules: ['SUM', 'EQUAL'] },
      medium: { dominoes: 8, rules: ['SUM', 'EQUAL', 'NOT_EQUAL'] },
      hard: { dominoes: 12, rules: ['SUM', 'EQUAL', 'NOT_EQUAL', 'GREATER_THAN', 'LESS_THAN'] }
    };

    // State Variables
    let currentDiff = 'easy';
    let currentPuzzle = null;
    let placedDominoes = []; // { id, dominoId, val1, val2, rot, x, y }
    let trayDominoes = [];   // { id, val1, val2, rot }
    let elapsedSeconds = 0;
    let timerInterval = null;
    let isSolved = false;
    let cellSize = 56;

    // Pointer Drag Tracking
    let activeDrag = null;

    // --- PIP DOT COORDINATES ---
    function getPipPositions(val) {
      // Return percentages [top%, left%] inside half square
      switch(val) {
        case 1: return [[50, 50]];
        case 2: return [[26, 26], [74, 74]];
        case 3: return [[24, 24], [50, 50], [76, 76]];
        case 4: return [[26, 26], [26, 74], [74, 26], [74, 74]];
        case 5: return [[24, 24], [24, 76], [50, 50], [76, 24], [76, 76]];
        case 6: return [[24, 26], [24, 74], [50, 26], [50, 74], [76, 26], [76, 74]];
        default: return [];
      }
    }

    // --- DOMINO TILE RENDER HELPER ---
    function createDominoElement(val1, val2, rot = 0, scale = 1, isTargetInBoard = false) {
      const isVert = (rot === 90 || rot === 270);
      const isFlipped = (rot === 180 || rot === 270);
      
      const v1 = isFlipped ? val2 : val1;
      const v2 = isFlipped ? val1 : val2;

      const tile = document.createElement('div');
      tile.className = `domino-tile ${isVert ? 'vertical' : ''}`;
      
      const unitW = isVert ? cellSize : cellSize * 2;
      const unitH = isVert ? cellSize * 2 : cellSize;

      tile.style.width = `${unitW * scale}px`;
      tile.style.height = `${unitH * scale}px`;

      // Render Half 1
      const half1 = document.createElement('div');
      half1.className = 'domino-half';
      getPipPositions(v1).forEach(([top, left]) => {
        const pip = document.createElement('div');
        pip.className = 'pip-dot';
        pip.style.top = `${top}%`;
        pip.style.left = `${left}%`;
        half1.appendChild(pip);
      });

      // Divider Line
      const divider = document.createElement('div');
      divider.className = isVert ? 'domino-divider-v' : 'domino-divider-h';

      // Render Half 2
      const half2 = document.createElement('div');
      half2.className = 'domino-half';
      getPipPositions(v2).forEach(([top, left]) => {
        const pip = document.createElement('div');
        pip.className = 'pip-dot';
        pip.style.top = `${top}%`;
        pip.style.left = `${left}%`;
        half2.appendChild(pip);
      });

      tile.appendChild(half1);
      tile.appendChild(divider);
      tile.appendChild(half2);

      return tile;
    }

    // --- PROCEDURAL MAP GENERATOR ---
    function generatePuzzle(difficulty) {
      const config = DIFF_CONFIG[difficulty];
      const dominoCount = config.dominoes;

      // Pool of standard dominoes
      const pool = [];
      for(let i=0; i<=6; i++) {
        for(let j=i; j<=6; j++) {
          pool.push([i, j]);
        }
      }
      // Shuffle pool
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }

      const chosenDominoes = pool.slice(0, dominoCount);

      // Random Walk Placement on Grid
      let placedPieces = []; // { domino: [val1, val2], x, y, rot }
      let gridMap = new Map(); // key "x,y" => { val, regionId }

      function isFree(x, y) {
        return !gridMap.has(`${x},${y}`);
      }

      // First piece at 0,0
      const firstRot = Math.random() > 0.5 ? 0 : 90;
      const firstDom = chosenDominoes[0];
      const firstPos = { domino: firstDom, x: 0, y: 0, rot: firstRot, id: 'sol-0' };
      placedPieces.push(firstPos);
      gridMap.set(`0,0`, { val: firstDom[0], pieceId: 0 });
      if (firstRot === 0) gridMap.set(`1,0`, { val: firstDom[1], pieceId: 0 });
      else gridMap.set(`0,1`, { val: firstDom[1], pieceId: 0 });

      // Grow polyomino for remaining pieces
      for (let i = 1; i < dominoCount; i++) {
        const dom = chosenDominoes[i];
        let placed = false;
        let attempts = 0;

        while (!placed && attempts < 200) {
          attempts++;
          // Pick an existing occupied cell to attach to
          const existingKeys = Array.from(gridMap.keys());
          const randKey = existingKeys[Math.floor(Math.random() * existingKeys.length)];
          const [ex, ey] = randKey.split(',').map(Number);

          // Try 4 directions
          const dirs = [
            { dx: 1, dy: 0 }, { dx: -1, dy: 0 },
            { dx: 0, dy: 1 }, { dx: 0, dy: -1 }
          ];
          const dir = dirs[Math.floor(Math.random() * dirs.length)];
          const targetX = ex + dir.dx;
          const targetY = ey + dir.dy;

          // Try horizontal or vertical
          const tryRot = Math.random() > 0.5 ? 0 : 90;
          const c2x = tryRot === 0 ? targetX + 1 : targetX;
          const c2y = tryRot === 90 ? targetY + 1 : targetY;

          if (isFree(targetX, targetY) && isFree(c2x, c2y)) {
            // Found valid location
            placedPieces.push({ domino: dom, x: targetX, y: targetY, rot: tryRot, id: `sol-${i}` });
            gridMap.set(`${targetX},${targetY}`, { val: dom[0], pieceId: i });
            gridMap.set(`${c2x},${c2y}`, { val: dom[1], pieceId: i });
            placed = true;
          }
        }

        if (!placed) {
          // Retry complete generation if stuck
          return generatePuzzle(difficulty);
        }
      }

      // Calculate Bounding Box and Normalize Coordinates to (0,0)
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      gridMap.forEach((_, key) => {
        const [x, y] = key.split(',').map(Number);
        if (x < minX) minX = x;
        if (y < minY) minY = y;
        if (x > maxX) maxX = x;
        if (y > maxY) maxY = y;
      });

      const width = maxX - minX + 1;
      const height = maxY - minY + 1;

      // Re-map normalized grid
      const normGridMap = new Map();
      gridMap.forEach((data, key) => {
        const [x, y] = key.split(',').map(Number);
        normGridMap.set(`${x - minX},${y - minY}`, data);
      });

      // Divide Cells into Regions (Size 2 to 5)
      const allCells = Array.from(normGridMap.keys());
      const unassigned = new Set(allCells);
      const regions = []; // { id, color, cells: ["x,y"], ruleType, targetVal, label }
      let regionIdCounter = 0;

      while (unassigned.size > 0) {
        const startCell = Array.from(unassigned)[0];
        const targetSize = Math.min(unassigned.size, Math.floor(Math.random() * 3) + 2); // 2 to 4
        
        const regionCells = [startCell];
        unassigned.delete(startCell);

        let queue = [startCell];
        while (queue.length > 0 && regionCells.length < targetSize) {
          const curr = queue.shift();
          const [cx, cy] = curr.split(',').map(Number);
          const neighbors = [
            `${cx+1},${cy}`, `${cx-1},${cy}`, `${cx},${cy+1}`, `${cx},${cy-1}`
          ].filter(n => unassigned.has(n));

          for (const n of neighbors) {
            if (regionCells.length < targetSize && unassigned.has(n)) {
              regionCells.push(n);
              unassigned.delete(n);
              queue.push(n);
            }
          }
        }

        // If leftover single cell, append to last region if possible
        if (regionCells.length === 1 && regions.length > 0) {
          regions[regions.length - 1].cells.push(startCell);
        } else {
          regions.push({
            id: regionIdCounter,
            color: REGION_PALETTES[regionIdCounter % REGION_PALETTES.length],
            cells: regionCells
          });
          regionIdCounter++;
        }
      }

      // Assign Rules to Each Region Based on Solution Values
      regions.forEach(reg => {
        const vals = reg.cells.map(c => normGridMap.get(c).val);
        const sum = vals.reduce((a, b) => a + b, 0);
        const allEqual = vals.every(v => v === vals[0]);
        const allUnique = new Set(vals).size === vals.length;

        const allowedRules = config.rules.filter(r => {
          if (r === 'EQUAL') return allEqual;
          if (r === 'NOT_EQUAL') return allUnique && vals.length > 1;
          return true;
        });

        const chosenRule = allowedRules[Math.floor(Math.random() * allowedRules.length)] || 'SUM';

        reg.ruleType = chosenRule;
        if (chosenRule === 'SUM') {
          reg.label = `${sum}`;
          reg.targetVal = sum;
        } else if (chosenRule === 'EQUAL') {
          reg.label = '=';
        } else if (chosenRule === 'NOT_EQUAL') {
          reg.label = '≠';
        } else if (chosenRule === 'GREATER_THAN') {
          const target = Math.max(0, sum - Math.floor(Math.random() * 3) - 1);
          reg.label = `>${target}`;
          reg.targetVal = target;
        } else if (chosenRule === 'LESS_THAN') {
          const target = sum + Math.floor(Math.random() * 3) + 1;
          reg.label = `<${target}`;
          reg.targetVal = target;
        }
      });

      // Prepare Tray Pieces (Shuffled with initial rotation 0)
      const trayPieces = chosenDominoes.map((dom, idx) => ({
        id: `piece-${idx}`,
        val1: dom[0],
        val2: dom[1],
        rot: 0
      }));
      // Shuffle tray
      for (let i = trayPieces.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [trayPieces[i], trayPieces[j]] = [trayPieces[j], trayPieces[i]];
      }

      return {
        width,
        height,
        gridMap: normGridMap,
        regions,
        trayDominoes: trayPieces
      };
    }

    // --- BOARD CALCULATIONS & RENDERING ---
    function renderBoard() {
      const card = document.getElementById('board-card');
      const gridEl = document.getElementById('board-grid');
      gridEl.innerHTML = '';

      if (!currentPuzzle) return;

      // Screen responsive cell size calculation
      const containerW = window.innerWidth * 0.9;
      const containerH = window.innerHeight * 0.52;
      const maxWCell = Math.floor(containerW / (currentPuzzle.width + 0.5));
      const maxHCell = Math.floor(containerH / (currentPuzzle.height + 0.5));
      cellSize = Math.max(38, Math.min(64, Math.min(maxWCell, maxHCell)));

      const totalW = currentPuzzle.width * cellSize;
      const totalH = currentPuzzle.height * cellSize;

      gridEl.style.width = `${totalW}px`;
      gridEl.style.height = `${totalH}px`;

      // Map cell to region
      const cellRegionMap = new Map();
      currentPuzzle.regions.forEach(reg => {
        reg.cells.forEach(c => cellRegionMap.set(c, reg));
      });

      // Check validation state for each region
      const regionValidation = new Map();
      currentPuzzle.regions.forEach(reg => {
        regionValidation.set(reg.id, validateRegion(reg));
      });

      // Render Region Cells
      for (let y = 0; y < currentPuzzle.height; y++) {
        for (let x = 0; x < currentPuzzle.width; x++) {
          const key = `${x},${y}`;
          if (!currentPuzzle.gridMap.has(key)) continue;

          const reg = cellRegionMap.get(key);
          const cellEl = document.createElement('div');
          cellEl.className = 'board-cell absolute';
          cellEl.style.width = `${cellSize}px`;
          cellEl.style.height = `${cellSize}px`;
          cellEl.style.left = `${x * cellSize}px`;
          cellEl.style.top = `${y * cellSize}px`;
          cellEl.style.backgroundColor = reg.color.bg;

          // Interior grid line
          const innerGrid = document.createElement('div');
          innerGrid.className = 'cell-inner-grid';
          cellEl.appendChild(innerGrid);

          // Outer Borders for Region Edges
          cellEl.style.setProperty('--region-border-color', reg.color.border);
          if (!currentPuzzle.gridMap.has(`${x},${y-1}`) || cellRegionMap.get(`${x},${y-1}`)?.id !== reg.id) {
            cellEl.classList.add('border-t-region');
          }
          if (!currentPuzzle.gridMap.has(`${x},${y+1}`) || cellRegionMap.get(`${x},${y+1}`)?.id !== reg.id) {
            cellEl.classList.add('border-b-region');
          }
          if (!currentPuzzle.gridMap.has(`${x-1},${y}`) || cellRegionMap.get(`${x-1},${y}`)?.id !== reg.id) {
            cellEl.classList.add('border-l-region');
          }
          if (!currentPuzzle.gridMap.has(`${x+1},${y}`) || cellRegionMap.get(`${x+1},${y}`)?.id !== reg.id) {
            cellEl.classList.add('border-r-region');
          }

          gridEl.appendChild(cellEl);
        }
      }

      // Render Region Rule Diamond Badges
      currentPuzzle.regions.forEach(reg => {
        // Find bottom-leftmost boundary cell for diamond badge
        let badgeCell = reg.cells[0];
        let maxScore = -Infinity;
        reg.cells.forEach(c => {
          const [cx, cy] = c.split(',').map(Number);
          const score = cy * 100 - cx; // bottom-left preference
          if (score > maxScore) {
            maxScore = score;
            badgeCell = c;
          }
        });

        const [bx, by] = badgeCell.split(',').map(Number);

        const badge = document.createElement('div');
        badge.className = 'rule-badge';
        badge.style.backgroundColor = reg.color.border;

        // Position on lower-right cell vertex
        badge.style.left = `${(bx + 0.5) * cellSize}px`;
        badge.style.top = `${(by + 1) * cellSize}px`;

        const text = document.createElement('span');
        text.className = 'rule-badge-text';
        text.innerText = reg.label;
        badge.appendChild(text);

        gridEl.appendChild(badge);
      });

      // Render Placed Domino Tiles
      placedDominoes.forEach(placed => {
        const domEl = createDominoElement(placed.val1, placed.val2, placed.rot, 1, true);
        domEl.style.position = 'absolute';
        domEl.style.left = `${placed.x * cellSize}px`;
        domEl.style.top = `${placed.y * cellSize}px`;
        domEl.style.zIndex = '20';
        domEl.dataset.placedId = placed.id;

        // Unified Pointer Events for Placed Piece
        attachPointerHandlers(domEl, placed, 'board');

        gridEl.appendChild(domEl);
      });

      renderTray();
    }

    // --- TRAY RENDERING ---
    function renderTray() {
      const trayEl = document.getElementById('domino-tray');
      trayEl.innerHTML = '';

      document.getElementById('tray-count').innerText = trayDominoes.length;

      if (trayDominoes.length === 0) {
        trayEl.innerHTML = `<span class="text-xs text-slate-400 font-medium my-auto">All dominoes placed on board!</span>`;
        return;
      }

      trayDominoes.forEach(dom => {
        const domWrap = document.createElement('div');
        domWrap.className = 'relative flex items-center justify-center p-1 rounded-xl transition hover:bg-slate-200/50';

        const domEl = createDominoElement(dom.val1, dom.val2, dom.rot, 0.85);
        domEl.dataset.trayId = dom.id;

        attachPointerHandlers(domEl, dom, 'tray');

        domWrap.appendChild(domEl);
        trayEl.appendChild(domWrap);
      });
    }

    // --- REGION RULE VALIDATION ---
    function getBoardPipValueAt(x, y) {
      for (const p of placedDominoes) {
        const isVert = (p.rot === 90 || p.rot === 270);
        const isFlipped = (p.rot === 180 || p.rot === 270);

        const v1 = isFlipped ? p.val2 : p.val1;
        const v2 = isFlipped ? p.val1 : p.val2;

        if (p.x === x && p.y === y) return v1;
        if (isVert && p.x === x && p.y === y + 1) return v2;
        if (!isVert && p.x === x + 1 && p.y === y) return v2;
      }
      return null;
    }

    function validateRegion(region) {
      const values = [];
      for (const cellKey of region.cells) {
        const [cx, cy] = cellKey.split(',').map(Number);
        const val = getBoardPipValueAt(cx, cy);
        if (val === null) return 'incomplete';
        values.push(val);
      }

      const sum = values.reduce((a, b) => a + b, 0);

      switch (region.ruleType) {
        case 'SUM':
          return sum === region.targetVal ? 'valid' : 'invalid';
        case 'EQUAL':
          return values.every(v => v === values[0]) ? 'valid' : 'invalid';
        case 'NOT_EQUAL':
          return new Set(values).size === values.length ? 'valid' : 'invalid';
        case 'GREATER_THAN':
          return sum > region.targetVal ? 'valid' : 'invalid';
        case 'LESS_THAN':
          return sum < region.targetVal ? 'valid' : 'invalid';
        default:
          return 'valid';
      }
    }

    function checkWinCondition() {
      if (placedDominoes.length < currentPuzzle.trayDominoes.length + placedDominoes.length) return false;

      for (const reg of currentPuzzle.regions) {
        if (validateRegion(reg) !== 'valid') return false;
      }

      // Solved!
      isSolved = true;
      clearInterval(timerInterval);
      sound.playWin();

      // Save Stats
      saveWinStats();

      // Show Win Modal
      setTimeout(() => {
        document.getElementById('win-time').innerText = formatTime(elapsedSeconds);
        document.getElementById('win-diff').innerText = currentDiff;

        const modal = document.getElementById('win-modal');
        const card = document.getElementById('win-modal-card');
        modal.classList.remove('hidden');
        setTimeout(() => {
          card.classList.remove('scale-95', 'opacity-0');
          card.classList.add('scale-100', 'opacity-100');
        }, 10);
      }, 300);

      return true;
    }

    // --- UNIFIED POINTER DRAG & DROP CONTROLLER ---
    function attachPointerHandlers(element, dominoData, source) {
      element.addEventListener('pointerdown', (e) => {
        if (isSolved) return;
        e.preventDefault();

        const rect = element.getBoundingClientRect();
        
        activeDrag = {
          data: dominoData,
          source: source,
          startX: e.clientX,
          startY: e.clientY,
          offsetX: e.clientX - rect.left,
          offsetY: e.clientY - rect.top,
          isDragging: false,
          element: element
        };

        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);
        window.addEventListener('pointercancel', onPointerUp);
      });
    }

    function onPointerMove(e) {
      if (!activeDrag) return;

      const dx = e.clientX - activeDrag.startX;
      const dy = e.clientY - activeDrag.startY;
      const dist = Math.sqrt(dx * dx + dy * dy);

      // Start drag threshold
      if (!activeDrag.isDragging && dist > 8) {
        activeDrag.isDragging = true;

        // Show Drag Ghost
        const ghost = document.getElementById('drag-ghost');
        ghost.innerHTML = '';
        const ghostDom = createDominoElement(activeDrag.data.val1, activeDrag.data.val2, activeDrag.data.rot, 1);
        ghost.appendChild(ghostDom);
        ghost.style.display = 'block';

        // Dim source element
        activeDrag.element.style.opacity = '0.3';
      }

      if (activeDrag.isDragging) {
        const ghost = document.getElementById('drag-ghost');
        ghost.style.left = `${e.clientX - activeDrag.offsetX}px`;
        ghost.style.top = `${e.clientY - activeDrag.offsetY}px`;
      }
    }

    function onPointerUp(e) {
      if (!activeDrag) return;

      window.removeEventListener('pointermove', onPointerMove);
      window.removeEventListener('pointerup', onPointerUp);
      window.removeEventListener('pointercancel', onPointerUp);

      const ghost = document.getElementById('drag-ghost');
      ghost.style.display = 'none';
      if (activeDrag.element) activeDrag.element.style.opacity = '1';

      if (!activeDrag.isDragging) {
        // --- TAP / CLICK ACTION ---
        if (activeDrag.source === 'tray') {
          // Rotate in tray
          activeDrag.data.rot = (activeDrag.data.rot + 90) % 360;
          sound.playClick();
          renderTray();
          saveGameState();
        } else if (activeDrag.source === 'board') {
          // Return from board to tray
          placedDominoes = placedDominoes.filter(p => p.id !== activeDrag.data.id);
          trayDominoes.push({
            id: activeDrag.data.dominoId || activeDrag.data.id,
            val1: activeDrag.data.val1,
            val2: activeDrag.data.val2,
            rot: activeDrag.data.rot
          });
          sound.playClick();
          renderBoard();
          saveGameState();
        }
      } else {
        // --- DRAG DROP ACTION ---
        const boardCard = document.getElementById('board-grid');
        const boardRect = boardCard.getBoundingClientRect();

        // Calculate target cell on board
        const dropX = e.clientX - activeDrag.offsetX;
        const dropY = e.clientY - activeDrag.offsetY;

        const cellX = Math.round((dropX - boardRect.left) / cellSize);
        const cellY = Math.round((dropY - boardRect.top) / cellSize);

        const rot = activeDrag.data.rot;
        const isVert = (rot === 90 || rot === 270);

        const c1Key = `${cellX},${cellY}`;
        const c2Key = isVert ? `${cellX},${cellY + 1}` : `${cellX + 1},${cellY}`;

        // Validate if cells exist on board
        const isValidPlacement = currentPuzzle.gridMap.has(c1Key) && currentPuzzle.gridMap.has(c2Key);

        // Check overlapping placed dominoes (excluding self if moving on board)
        const isOccupied = placedDominoes.some(p => {
          if (activeDrag.source === 'board' && p.id === activeDrag.data.id) return false;
          const pVert = (p.rot === 90 || p.rot === 270);
          const p1 = `${p.x},${p.y}`;
          const p2 = pVert ? `${p.x},${p.y + 1}` : `${p.x + 1},${p.y}`;
          return (p1 === c1Key || p1 === c2Key || p2 === c1Key || p2 === c2Key);
        });

        if (isValidPlacement && !isOccupied) {
          // Move or Place Domino
          if (activeDrag.source === 'board') {
            placedDominoes = placedDominoes.filter(p => p.id !== activeDrag.data.id);
          } else {
            trayDominoes = trayDominoes.filter(t => t.id !== activeDrag.data.id);
          }

          placedDominoes.push({
            id: `placed-${Date.now()}-${Math.random()}`,
            dominoId: activeDrag.data.dominoId || activeDrag.data.id,
            val1: activeDrag.data.val1,
            val2: activeDrag.data.val2,
            rot: activeDrag.data.rot,
            x: cellX,
            y: cellY
          });

          sound.playPlace();
          renderBoard();
          saveGameState();
          checkWinCondition();
        } else {
          // Invalid drop -> Return to Tray if from board, or keep in tray
          if (activeDrag.source === 'board') {
            placedDominoes = placedDominoes.filter(p => p.id !== activeDrag.data.id);
            trayDominoes.push({
              id: activeDrag.data.dominoId || activeDrag.data.id,
              val1: activeDrag.data.val1,
              val2: activeDrag.data.val2,
              rot: activeDrag.data.rot
            });
            renderBoard();
            saveGameState();
          }
        }
      }

      activeDrag = null;
    }

    // --- TIMER SYSTEM ---
    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!isSolved) {
          elapsedSeconds++;
          document.getElementById('timer-display').innerText = formatTime(elapsedSeconds);
        }
      }, 1000);
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    // --- LOCAL STORAGE & GAME SAVING ---
    const STORAGE_KEY = 'nyt_pips_save_v4';
    const STATS_KEY = 'nyt_pips_stats_v4';

    function saveGameState() {
      const state = {
        diff: currentDiff,
        puzzle: currentPuzzle,
        placedDominoes,
        trayDominoes,
        elapsedSeconds,
        isSolved
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function loadGameState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return false;
      try {
        const state = JSON.parse(saved);
        currentDiff = state.diff;
        
        // Restore grid map
        currentPuzzle = state.puzzle;
        currentPuzzle.gridMap = new Map(currentPuzzle.gridMap);

        placedDominoes = state.placedDominoes || [];
        trayDominoes = state.trayDominoes || [];
        elapsedSeconds = state.elapsedSeconds || 0;
        isSolved = state.isSolved || false;

        document.getElementById('timer-display').innerText = formatTime(elapsedSeconds);
        updateDiffButtons();
        renderBoard();
        startTimer();
        return true;
      } catch(e) {
        return false;
      }
    }

    function saveWinStats() {
      let stats = JSON.parse(localStorage.getItem(STATS_KEY) || '{}');
      if (!stats[currentDiff]) {
        stats[currentDiff] = { wins: 0, bestTime: Infinity, totalTime: 0 };
      }
      const diffStats = stats[currentDiff];
      diffStats.wins += 1;
      diffStats.totalTime += elapsedSeconds;
      if (elapsedSeconds < diffStats.bestTime) diffStats.bestTime = elapsedSeconds;

      localStorage.setItem(STATS_KEY, JSON.stringify(stats));
    }

    function renderStats() {
      const stats = JSON.parse(localStorage.getItem(STATS_KEY) || '{}');
      const grid = document.getElementById('stats-grid');
      grid.innerHTML = '';

      ['easy', 'medium', 'hard'].forEach(d => {
        const st = stats[d] || { wins: 0, bestTime: Infinity, totalTime: 0 };
        const avg = st.wins > 0 ? Math.round(st.totalTime / st.wins) : 0;
        const best = st.bestTime === Infinity ? '--:--' : formatTime(st.bestTime);

        const card = document.createElement('div');
        card.className = 'bg-slate-50 border border-slate-200 rounded-2xl p-3 text-center space-y-1';
        card.innerHTML = `
          <div class="font-bold text-xs uppercase text-slate-500">${d}</div>
          <div class="text-xl font-extrabold text-slate-800">${st.wins} <span class="text-xs text-slate-400 font-normal">wins</span></div>
          <div class="text-[11px] text-slate-500">Best: <span class="font-mono font-semibold text-slate-700">${best}</span></div>
          <div class="text-[11px] text-slate-500">Avg: <span class="font-mono font-semibold text-slate-700">${st.wins > 0 ? formatTime(avg) : '--:--'}</span></div>
        `;
        grid.appendChild(card);
      });
    }

    // --- BUTTON EVENT LISTENERS ---
    function updateDiffButtons() {
      document.querySelectorAll('.btn-diff').forEach(btn => {
        if (btn.dataset.diff === currentDiff) {
          btn.className = 'btn-diff px-3 py-1 rounded-lg transition font-bold text-xs sm:text-sm bg-white text-slate-900 shadow-sm';
        } else {
          btn.className = 'btn-diff px-3 py-1 rounded-lg transition font-medium text-xs sm:text-sm text-slate-600 hover:text-slate-900';
        }
      });
    }

    function startNewGame(diff = currentDiff) {
      currentDiff = diff;
      updateDiffButtons();
      isSolved = false;
      elapsedSeconds = 0;
      document.getElementById('timer-display').innerText = '00:00';

      currentPuzzle = generatePuzzle(currentDiff);
      placedDominoes = [];
      trayDominoes = [...currentPuzzle.trayDominoes];

      renderBoard();
      startTimer();
      saveGameState();
    }

    document.querySelectorAll('.btn-diff').forEach(btn => {
      btn.addEventListener('click', () => {
        sound.playClick();
        startNewGame(btn.dataset.diff);
      });
    });

    document.getElementById('btn-new').addEventListener('click', () => {
      sound.playClick();
      startNewGame();
    });

    document.getElementById('btn-restart').addEventListener('click', () => {
      sound.playClick();
      trayDominoes = [...trayDominoes, ...placedDominoes.map(p => ({
        id: p.dominoId || p.id,
        val1: p.val1,
        val2: p.val2,
        rot: p.rot
      }))];
      placedDominoes = [];
      renderBoard();
      saveGameState();
    });

    document.getElementById('btn-sound').addEventListener('click', () => {
      sound.enabled = !sound.enabled;
      document.getElementById('icon-sound-on').classList.toggle('hidden', !sound.enabled);
      document.getElementById('icon-sound-off').classList.toggle('hidden', sound.enabled);
    });

    document.getElementById('btn-stats').addEventListener('click', () => {
      sound.playClick();
      renderStats();
      document.getElementById('stats-modal').classList.remove('hidden');
    });

    document.getElementById('btn-close-stats').addEventListener('click', () => {
      document.getElementById('stats-modal').classList.add('hidden');
    });

    document.getElementById('btn-reset-stats').addEventListener('click', () => {
      if (confirm('Are you sure you want to reset all win statistics?')) {
        localStorage.removeItem(STATS_KEY);
        renderStats();
      }
    });

    document.getElementById('btn-win-next').addEventListener('click', () => {
      const modal = document.getElementById('win-modal');
      const card = document.getElementById('win-modal-card');
      card.classList.remove('scale-100', 'opacity-100');
      card.classList.add('scale-95', 'opacity-0');
      setTimeout(() => {
        modal.classList.add('hidden');
        startNewGame();
      }, 150);
    });

    // Window Resize Handler
    window.addEventListener('resize', () => {
      if (currentPuzzle) renderBoard();
    });

    // --- INITIALIZATION ---
    window.onload = () => {
      if (!loadGameState()) {
        startNewGame('easy');
      }
    };
  </script>
